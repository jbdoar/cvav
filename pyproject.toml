[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cvav"
version = "0.1.0"
description = "Playful experiments in video feedback"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "opencv-python>=4.8"]

[project.scripts]
cvav = "cvav.demo:main"

[tool.setuptools.packages.find]
include = ["cvav*"]
